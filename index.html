<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Personal Test Information</title>
    <style>
        body {
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Device Information</h2>
        <p id="ua">User-Agent:</p>
        <p id="platform">Platform:</p>
        <p id="other_info">OtherInfo:</p>

        <button onclick="openiOSApp()">打开iOS应用</button>
        <button onclick="openAndroidApp()">打开安卓应用</button>


    </div>
    <script>
        
        const ua = navigator.userAgent; 
        const platform = navigator.platform; 

        const other_info = `window.android: ${window.android} \n window.webkit: ${window.webkit} \n window.navigator.standalone: ${window.navigator.standalone} \n document.location: ${document.location}`;
        document.getElementById('ua').textContent = `User-Agent: ${ua}`;
        document.getElementById('platform').textContent = `Platform: ${platform}`;
        document.getElementById('other_info').textContent = `OtherInfo: ${other_info}`;
        
 
        function openAndroidApp() {
        
        var url = 'cloud://com.foxcorp.foxcloud/message?token=123456&userName=987654';
        var store_url = 'https://play.google.com/store/apps/details?id=com.foxcorp.foxcloud';
        var timeout = setTimeout(function() {
            window.location = store_url;  
        }, 2000);  

        window.location = url;

        window.onblur = function() {
            clearTimeout(timeout);
        };
        }

        function openiOSApp() {
        var url = 'cloudcom.x2cloud.foxcloud://com.x2cloud.foxcloud/message?token=123456&userName=987654';
        var store_url = 'https://itunes.apple.com/app/id6714471433';

        var timeout = setTimeout(function() {
            window.location = store_url;  
        }, 2000);  

        window.location = url;

        window.onblur = function() {
            clearTimeout(timeout);
        };
        }


    </script>
</body>
</html>
