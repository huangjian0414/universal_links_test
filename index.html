<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Personal Test Information</title>
    <style>
        body {
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Device Information</h2>
        <p id="ua">User-Agent:</p>
        <p id="platform">Platform:</p>
        <p id="other_info">OtherInfo:</p>


        <input id="token" type="text" placeholder="token">
        <input id="user_name" type="text" placeholder="username">
        <br>
        <br>
        <button onclick="openiOSMyNexCloudApp()">打开iOS-MyNexCloud应用</button>
        <button onclick="openAndroidMyNexCloudApp()">打开Android-MyNexCloud应用</button>
        <br>
        <br>
        <button onclick="openiOSLumiCloudApp()">打开iOS-LumiCloud应用</button>
        <button onclick="openAndroidLumiCloudApp()">打开Android-LumiCloud应用</button>

    </div>
    <script>

        const ua = navigator.userAgent;
        const platform = navigator.platform;

        const other_info = `window.android: ${window.android} \n window.webkit: ${window.webkit} \n window.navigator.standalone: ${window.navigator.standalone} \n document.location: ${document.location}`;
        document.getElementById('ua').textContent = `User-Agent: ${ua}`;
        document.getElementById('platform').textContent = `Platform: ${platform}`;
        document.getElementById('other_info').textContent = `OtherInfo: ${other_info}`;


        function openAndroidMyNexCloudApp() {

            var token = document.getElementById("token").value;
            var user_name = document.getElementById("user_name").value;
            if (token.trim() === "") {
                token = "test1234"
            }
            if (user_name.trim() === "") {
                user_name = "test9876"
            }

            var url = `cloud://com.foxcorp.foxcloud/message?token=${token}&userName=${user_name}`;
            var store_url = 'https://play.google.com/store/apps/details?id=com.foxcorp.foxcloud';
            var timeout = setTimeout(function () {
                window.location.href = store_url;
            }, 2000);

            window.location.href = url;

            window.onblur = function () {
                console.log("窗口失去焦点了！");
                clearTimeout(timeout);
            };
        }

        function openiOSMyNexCloudApp() {

            var token = document.getElementById("token").value;
            var user_name = document.getElementById("user_name").value;
            if (token.trim() === "") {
                token = "test1234"
            }
            if (user_name.trim() === "") {
                user_name = "test9876"
            }

            var url = `cloudcom.x2cloud.foxcloud://com.x2cloud.foxcloud/message?token=${token}&userName=${user_name}`;
            var store_url = 'https://itunes.apple.com/app/id6714471433';

            var timeout = setTimeout(function () {
                window.location.href = store_url;
            }, 2000);

            try {
                window.location.href = url;
                console.log("跳转到页面成功");
            } catch (e) {
                console.log("跳转失败", e);
            }


            window.onblur = function () {
                console.log("窗口失去焦点了！");
                clearTimeout(timeout);
            };
        }

        function openAndroidLumiCloudApp() {

            var token = document.getElementById("token").value;
            var user_name = document.getElementById("user_name").value;
            if (token.trim() === "") {
                token = "test1234"
            }
            if (user_name.trim() === "") {
                user_name = "test9876"
            }

            var url = `cloud://com.luminyscorp.lumicloud/message?token=${token}&userName=${user_name}`;
            var store_url = 'https://play.google.com/store/apps/details?id=com.luminyscorp.lumicloud';
            var timeout = setTimeout(function () {
                window.location.href = store_url;
            }, 2000);

            window.location.href = url;

            window.onblur = function () {
                console.log("窗口失去焦点了！");
                clearTimeout(timeout);
            };
        }

        function openiOSLumiCloudApp() {

            var token = document.getElementById("token").value;
            var user_name = document.getElementById("user_name").value;
            if (token.trim() === "") {
                token = "test1234"
            }
            if (user_name.trim() === "") {
                user_name = "test9876"
            }

            var url = `cloudcom.luminys.lumicloud://com.luminys.lumicloud/message?token=${token}&userName=${user_name}`;
            var store_url = 'https://itunes.apple.com/app/id6714471391';

            var timeout = setTimeout(function () {
                window.location.href = store_url;
            }, 2000);

            window.location.href = url;

            window.onblur = function () {
                console.log("窗口失去焦点了！");
                clearTimeout(timeout);
            };
        }

    </script>
</body>

</html>
